services:
  micro-ros-agent:
    container_name: microros-agent
    image: microros/micro-ros-agent:kilted
    # host networking: the agent listens on 0.0.0.0:8888 and participates
    # directly in the ROS 2 graph (DDS discovery via multicast)
    network_mode: host
    # share /dev/shm with the host so Fast DDS can use shared memory instead of
    # falling back to UDP when talking to other containers on this machine
    ipc: host
    # --privileged + /dev mount only needed if you later switch to a
    # serial/USB transport; harmless for UDP
    privileged: true
    volumes:
      - /dev:/dev
    # UDP transport: talk UDP to any LAN client; the Nucleo Kconfig
    # (CONFIG_MICROROS_AGENT_IP/PORT) must point at this Pi's IP and port 8888
    #
    # -v4 is the debug level. -v6 also logs every XRCE packet, which is slow on
    # an SD card; use it only while diagnosing.
    command: udp4 --port 8888 -v4
    restart: unless-stopped

  # Optional: LED control without a container start per command. See README
  # "Low-latency control". Keeps one publisher matched with the agent and
  # watches ctrl/led.
  led-ctl:
    container_name: led-ctl
    image: ros:humble
    network_mode: host
    ipc: host
    environment:
      LED_CTRL_FILE: /ctrl/led
      # Optional: use Eclipse Cyclone DDS instead of the default Fast DDS.
      # Only valid if the image contains it (check with:
      #   ros2 pkg list | grep rmw_cyclonedds). See README section 5.
      # RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    volumes:
      - ./led_ctl.py:/led_ctl.py:ro
      - ./ctrl:/ctrl
    command: bash -c "source /opt/ros/humble/setup.bash && python3 /led_ctl.py"
    restart: unless-stopped
