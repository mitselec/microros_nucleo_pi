#
# Picolibc overlay for Zephyr 4.4 and newer.
#
# Zephyr 4.4 requires Zephyr SDK 1.0.x, and that SDK no longer ships newlib.
# Build with this overlay on top of prj.conf:
#
#   west build -b nucleo_f767zi -p always . -- \
#     -DEXTRA_CONF_FILE=prj_picolibc.conf
#
# Zephyr 4.3 is the exception: its own POSIX timer code does not compile
# against picolibc, so keep the newlib default from prj.conf there.

CONFIG_NEWLIB_LIBC=n
CONFIG_PICOLIBC=y
