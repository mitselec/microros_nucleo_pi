name: Zephyr compatibility probe

# Temporary: builds this app against several Zephyr releases to find out which
# one breaks and where. Not part of the normal CI; the branch is deleted after.

on:
  push:
    branches: [test/zephyr-4x]
  workflow_dispatch:

jobs:
  probe:
    name: ${{ matrix.zephyr }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - zephyr: v4.2.0
            image: zephyrprojectrtos/zephyr-build:v0.30.0
          - zephyr: v4.3.0
            image: zephyrprojectrtos/zephyr-build:v0.30.0
          - zephyr: v4.4.0
            image: zephyrprojectrtos/zephyr-build:v0.30.0
          - zephyr: v4.5.0
            image: zephyrprojectrtos/zephyr-build:v0.30.0
    container:
      image: ${{ matrix.image }}
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Pin Zephyr revision
        run: |
          sed -i "s/revision: v4.1.0/revision: ${{ matrix.zephyr }}/" nucleo_f767zi_microros/west.yml
          grep -n "revision:" nucleo_f767zi_microros/west.yml

      - name: Install build prerequisites
        run: pip3 install catkin_pkg lark-parser empy==3.3.4 colcon-common-extensions

      - name: Initialize west workspace
        run: |
          west init -l nucleo_f767zi_microros
          west update

      - name: Install Zephyr requirements
        run: pip3 install -r zephyr/scripts/requirements.txt

      - name: Set Zephyr environment
        run: |
          echo "ZEPHYR_BASE=$GITHUB_WORKSPACE/zephyr" >> "$GITHUB_ENV"
          echo "ZEPHYR_TOOLCHAIN_VARIANT=zephyr" >> "$GITHUB_ENV"
          echo "ZEPHYR_SDK_INSTALL_DIR=$(ls -d /opt/toolchains/zephyr-sdk-* | tail -1)" >> "$GITHUB_ENV"

      - name: Build firmware
        run: |
          west build -b nucleo_f767zi -p always nucleo_f767zi_microros \
            -- -DAPP_VERSION="${{ matrix.zephyr }}" > build.log 2>&1 \
            || echo "=== BUILD FAILED ===" >> build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.zephyr }}
          path: build.log
          if-no-files-found: warn

      - name: Report
        run: |
          if grep -q "=== BUILD FAILED ===" build.log; then
            echo "RESULT: FAILED"
            echo "----- build.log -----"
            sed -n '1,140p' build.log
          else
            echo "RESULT: OK"
            tail -5 build.log
          fi
