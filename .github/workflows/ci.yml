name: CI

on:
  push:
    branches: [main]
    # Pushing a version tag (v1.2.3) builds the firmware and publishes it as a
    # GitHub Release. Path filters are not applied to tag pushes.
    tags: ['v*']
    # Only rebuild when something that actually goes into the firmware (or the
    # workflow itself) changes. Docs-only commits stay cheap: no CI run.
    paths:
      - 'nucleo_f767zi_microros/**'
      - '!nucleo_f767zi_microros/**/*.md'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'nucleo_f767zi_microros/**'
      - '!nucleo_f767zi_microros/**/*.md'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-firmware:
    name: Build Zephyr firmware (nucleo_f767zi)
    runs-on: ubuntu-latest
    container:
      # Same image family used & tested by the micro-ROS Zephyr module
      image: zephyrprojectrtos/zephyr-build:v0.26.17
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west workspace
        uses: actions/cache@v4
        with:
          path: |
            .west
            zephyr
            modules
          key: west-${{ runner.os }}-${{ hashFiles('nucleo_f767zi_microros/west.yml') }}
          restore-keys: |
            west-${{ runner.os }}-

      - name: Install build prerequisites
        run: |
          pip3 install catkin_pkg lark-parser empy==3.3.4 colcon-common-extensions

      - name: Initialize west workspace
        run: |
          if [ ! -d .west ]; then
            west init -l nucleo_f767zi_microros
          fi
          west update

      - name: Install Zephyr requirements
        run: pip3 install -r zephyr/scripts/requirements.txt

      - name: Set Zephyr environment
        run: |
          # The zephyr-build image sets ZEPHYR_BASE=/workdir/zephyr in its
          # Dockerfile, which doesn't exist on GitHub Actions (checkout is at
          # /__w/...). Override it so apps using `find_package(Zephyr HINTS
          # $ENV{ZEPHYR_BASE})` resolve correctly.
          echo "ZEPHYR_BASE=$GITHUB_WORKSPACE/zephyr" >> "$GITHUB_ENV"
          echo "ZEPHYR_TOOLCHAIN_VARIANT=zephyr" >> "$GITHUB_ENV"
          echo "ZEPHYR_SDK_INSTALL_DIR=$(ls -d /opt/toolchains/zephyr-sdk-* | tail -1)" >> "$GITHUB_ENV"

      - name: Build firmware
        run: |
          # Bake the version into the binary so the boot log identifies the build.
          # No `git` here: the Zephyr container runs as a different user than the
          # checkout, and git refuses to read such a repository ("dubious
          # ownership"). GITHUB_SHA is already the commit being built.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            APP_VERSION="${GITHUB_REF_NAME}"
          else
            APP_VERSION="${GITHUB_REF_NAME}-$(printf %s "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "Building $APP_VERSION"
          west build -b nucleo_f767zi -p always nucleo_f767zi_microros -- -DAPP_VERSION="$APP_VERSION"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nucleo_f767zi-microros-firmware
          path: |
            build/zephyr/*.hex
            build/zephyr/*.bin
            build/zephyr/*.elf
          if-no-files-found: error

  release:
    name: Publish GitHub release
    # Only for tag pushes, and only if the firmware actually built.
    needs: build-firmware
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for CHANGELOG.md)
        uses: actions/checkout@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: nucleo_f767zi-microros-firmware
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          # `gh` needs to know which repository to talk to.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Release notes: the CHANGELOG section whose heading matches the tag,
          # e.g. "## [1.0.1] - 2026-11-23" for tag v1.0.1.
          version="${TAG#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' CHANGELOG.md > notes.md

          if [ -s notes.md ]; then
            # Drop a possible blank line left over from the heading.
            sed -i '/./,$!d' notes.md
          else
            echo "Firmware for the NUCLEO-F767ZI built by CI from \`$TAG\`." > notes.md
          fi

          # Flashing instructions are part of the release body so the asset is
          # usable without opening the repository.
          cat >> notes.md <<'EOF'

          ---

          ### Flashing

          Download `zephyr.hex` below and flash it over the board's ST-LINK USB
          port with STM32CubeProgrammer:

          ```powershell
          STM32_Programmer_CLI -c port=SWD mode=UR reset=HWrst -w zephyr.hex -v -g
          ```

          `mode=UR reset=HWrst` (connect under reset) is required on boards
          where the plain `mode=NORMAL` connection fails with
          `ST-LINK error (DEV_CONNECT_ERR)`.

          The Pi side is unchanged: see the repository README for the
          micro-ROS agent setup.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating notes and assets."
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" dist/zephyr.hex dist/zephyr.bin dist/zephyr.elf --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file notes.md \
              dist/zephyr.hex dist/zephyr.bin dist/zephyr.elf
          fi
